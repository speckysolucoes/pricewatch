<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PriceWatch — Monitor de Preços</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── DESIGN SYSTEM ─────────────────────────────── */
    :root {
      --bg:         #0a0a0f;
      --bg2:        #111118;
      --bg3:        #1a1a24;
      --border:     rgba(255,255,255,0.07);
      --border-hi:  rgba(255,255,255,0.15);
      --text:       #e8e8f0;
      --text-dim:   #7070a0;
      --text-faint: #3a3a5a;
      --accent:     #6c5ce7;
      --accent-glow:#6c5ce740;
      --green:      #00d97e;
      --green-dim:  #00d97e20;
      --red:        #ff4d6a;
      --red-dim:    #ff4d6a20;
      --yellow:     #ffd166;
      --yellow-dim: #ffd16620;
      --radius:     12px;
      --radius-lg:  20px;
      --font-head:  'Syne', sans-serif;
      --font-body:  'DM Sans', sans-serif;
      --font-mono:  'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── AUTH PAGES ─────────────────────────────────── */
    .auth-wrap {
      height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--bg);
      position: relative;
    }

    .auth-wrap::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 700px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      width: 420px;
      position: relative;
      z-index: 1;
    }

    .auth-logo {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-logo .dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .auth-title {
      font-family: var(--font-head);
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .auth-sub {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* ─── FORM ───────────────────────────────────────── */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-input::placeholder { color: var(--text-faint); }

    /* ─── BUTTONS ────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-family: var(--font-head);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
      padding: 14px;
    }

    .btn-primary:hover { background: #7d6ef0; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      border-color: var(--border-hi);
      color: var(--text);
    }

    .btn-danger {
      background: var(--red-dim);
      color: var(--red);
      border: 1px solid rgba(255,77,106,0.2);
    }

    .btn-danger:hover { background: rgba(255,77,106,0.25); }

    .btn-sm { padding: 7px 14px; font-size: 12px; }
    .btn-icon { padding: 8px; }

    .auth-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .auth-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    /* ─── LAYOUT PRINCIPAL ───────────────────────────── */
    .app-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      min-height: 100vh;
    }

    /* ─── SIDEBAR ────────────────────────────────────── */
    .sidebar {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar-logo {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      padding: 0 12px 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-logo .dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      transition: all 0.15s;
      margin-bottom: 2px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent);
    }

    .nav-icon { font-size: 16px; width: 20px; text-align: center; }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .user-avatar {
      width: 32px; height: 32px;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .user-info { flex: 1; min-width: 0; }
    .user-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-plan {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .plan-badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .plan-free { background: var(--bg3); color: var(--text-dim); }
    .plan-premium { background: var(--yellow-dim); color: var(--yellow); }

    /* ─── MAIN CONTENT ───────────────────────────────── */
    .main {
      background: var(--bg);
      overflow-y: auto;
    }

    .page-header {
      padding: 24px 28px 0;
      margin-bottom: 24px;
    }

    .page-title {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
    }

    .page-sub {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .page-body { padding: 0 28px 28px; }

    /* ─── STAT CARDS ─────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }

    .stat-card.green::after { background: var(--green); }
    .stat-card.accent::after { background: var(--accent); }
    .stat-card.yellow::after { background: var(--yellow); }
    .stat-card.red::after { background: var(--red); }

    .stat-icon {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .stat-value {
      font-family: var(--font-head);
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ─── CARDS GENÉRICOS ────────────────────────────── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .card-body { padding: 20px 24px; }

    /* ─── DUAS COLUNAS ───────────────────────────────── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ─── LISTA DE PRODUTOS ──────────────────────────── */
    .product-list { display: flex; flex-direction: column; gap: 1px; }

    .product-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: var(--bg2);
      transition: background 0.15s;
      cursor: pointer;
    }

    .product-row:hover { background: var(--bg3); }
    .product-row:first-child { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .product-row:last-child { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    .product-row:only-child { border-radius: var(--radius-lg); }

    .product-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-store {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .price-current {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 500;
      color: var(--green);
    }

    .price-target {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ─── STATUS BADGES ──────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
    }

    .badge-active { background: var(--green-dim); color: var(--green); }
    .badge-active::before { background: var(--green); }
    .badge-paused { background: var(--bg3); color: var(--text-dim); }
    .badge-paused::before { background: var(--text-dim); }
    .badge-alerted { background: var(--yellow-dim); color: var(--yellow); }
    .badge-alerted::before { background: var(--yellow); }
    .badge-error { background: var(--red-dim); color: var(--red); }
    .badge-error::before { background: var(--red); }

    /* ─── FORMULÁRIO ADICIONAR PRODUTO ───────────────── */
    .add-form {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 24px;
    }

    .discount-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: var(--green-dim);
      color: var(--green);
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    /* ─── ALERT FEED ─────────────────────────────────── */
    .alert-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .alert-item:last-child { border-bottom: none; }

    .alert-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .alert-icon.drop { background: var(--green-dim); }
    .alert-icon.promo { background: var(--yellow-dim); }

    .alert-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .alert-meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .alert-price {
      margin-left: auto;
      text-align: right;
    }

    .alert-price .new { font-family: var(--font-mono); font-size: 14px; color: var(--green); font-weight: 500; }
    .alert-price .old { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); text-decoration: line-through; }

    /* ─── GRÁFICO SIMPLES ────────────────────────────── */
    .chart-wrap {
      height: 160px;
      position: relative;
      overflow: hidden;
    }

    canvas { width: 100% !important; height: 100% !important; }

    /* ─── MODAL ──────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 480px;
      max-width: 100%;
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-title {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }

    /* ─── TOAST ──────────────────────────────────────── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
    }

    .toast {
      background: var(--bg2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.3s ease;
      max-width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .toast.success { border-color: rgba(0,217,126,0.3); }
    .toast.error { border-color: rgba(255,77,106,0.3); }

    /* ─── EMPTY STATES ───────────────────────────────── */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-dim);
    }

    .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-title { font-family: var(--font-head); font-size: 16px; color: var(--text); margin-bottom: 8px; }
    .empty-sub { font-size: 13px; }

    /* ─── SAVINGS BANNER ─────────────────────────────── */
    .savings-banner {
      background: linear-gradient(135deg, rgba(108,92,231,0.15) 0%, rgba(0,217,126,0.1) 100%);
      border: 1px solid rgba(108,92,231,0.3);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .savings-amount {
      font-family: var(--font-head);
      font-size: 36px;
      font-weight: 800;
      color: var(--green);
    }

    .savings-label { font-size: 13px; color: var(--text-dim); }

    /* ─── LOADING ────────────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-dim);
      font-size: 14px;
      gap: 10px;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── UTILS ──────────────────────────────────────── */
    .flex { display: flex; }
    .flex-center { align-items: center; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    .text-dim { color: var(--text-dim); }
    .text-accent { color: var(--accent); }
    .mono { font-family: var(--font-mono); }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mb-24 { margin-bottom: 24px; }
    .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

    /* ═══════════════════════════════════════════════════════
       RESPONSIVO — MOBILE FIRST
       Breakpoint: 768px
    ═══════════════════════════════════════════════════════ */

    /* ── Bottom Navigation Bar (mobile) ─────────────────── */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      z-index: 50;
      padding: 0 4px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-nav-inner {
      display: flex;
      height: 100%;
      align-items: stretch;
    }

    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 10px;
      font-family: var(--font-body);
      cursor: pointer;
      padding: 6px 0;
      border-radius: 8px;
      transition: color 0.15s;
    }

    .bottom-nav-item.active {
      color: var(--accent);
    }

    .bottom-nav-item .nav-icon-b {
      font-size: 20px;
      line-height: 1;
    }

    /* ── Mobile FAB (botão + Adicionar) ─────────────────── */
    .fab {
      display: none;
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 52px; height: 52px;
      background: var(--accent);
      border-radius: 50%;
      border: none;
      font-size: 24px;
      color: white;
      cursor: pointer;
      z-index: 49;
      box-shadow: 0 4px 20px rgba(108,92,231,0.5);
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {

      /* ── Esconde sidebar, mostra bottom nav ──────────── */
      .sidebar { display: none !important; }
      .bottom-nav { display: flex; }
      .fab { display: flex; }

      /* ── Layout vira coluna única ─────────────────────── */
      .app-layout {
        grid-template-columns: 1fr;
        min-height: 100vh;
      }

      .main {
        padding-bottom: 72px; /* espaço para bottom nav */
      }

      /* ── Auth — card ocupa tela toda ─────────────────── */
      .auth-wrap {
        height: 100svh; /* svh = respeita barra do browser */
        padding: 20px 16px;
        align-items: flex-start;
        padding-top: 40px;
      }

      .auth-card {
        width: 100%;
        max-width: 100%;
        padding: 32px 24px;
        border-radius: var(--radius);
      }

      /* ── Page header menor ───────────────────────────── */
      .page-header {
        padding: 20px 16px 0;
        margin-bottom: 16px;
      }

      .page-title { font-size: 22px; }
      .page-body { padding: 0 16px 16px; }

      /* ── Stats: 2 colunas compactas ──────────────────── */
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }

      .stat-card { padding: 14px; }
      .stat-value { font-size: 24px; }

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;

/* ═══════════════════════════════════════════════════════════
   API CLIENT
   ═══════════════════════════════════════════════════════════ */
const API_BASE = window.location.origin; // mesmo servidor que serve o HTML

const api = {
  token: () => localStorage.getItem('access_token'),

  headers() {
    const h = { 'Content-Type': 'application/json' };
    const t = this.token();
    if (t) h['Authorization'] = `Bearer ${t}`;
    return h;
  },

  async req(method, path, body) {
    let res;
    try {
      res = await fetch(`${API_BASE}${path}`, {
        method,
        headers: this.headers(),
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch(e) {
      throw new Error('Sem conexão com o servidor. Verifique sua internet.');
    }

    // Verifica se a resposta é JSON antes de parsear
    const contentType = res.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      // Render retornou HTML (servidor acordando) ou outro erro
      if (res.status === 503 || res.status === 502) {
        throw new Error('Servidor iniciando, aguarde 30 segundos e tente novamente.');
      }
      throw new Error('Servidor temporariamente indisponível. Recarregue a página.');
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `Erro ${res.status}`);
    return data;
  },

  get: (p) => api.req('GET', p),
  post: (p, b) => api.req('POST', p, b),
  patch: (p, b) => api.req('PATCH', p, b),
  delete: (p) => api.req('DELETE', p),

  // Auth
  register: (d) => api.post('/auth/register', d),

  // Billing
  plans: () => api.get('/billing/plans'),
  billingStatus: () => api.get('/billing/status'),
  createCheckout: (plan_id) => api.post('/billing/checkout', { plan_id }),
  cancelSubscription: () => api.post('/billing/cancel'),
  login: async (email, password) => {
    const form = new URLSearchParams();
    form.append('username', email);
    form.append('password', password);
    let res;
    try {
      res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: form,
      });
    } catch(e) {
      throw new Error('Sem conexão com o servidor. Verifique sua internet.');
    }

    // Detecta servidor acordando (retorna HTML em vez de JSON)
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      throw new Error('Servidor iniciando... Aguarde 30 segundos e tente novamente. 🔄');
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Email ou senha incorretos.');
    return data;
  },
  me: () => api.get('/auth/me'),

  // Dashboard
  stats: () => api.get('/dashboard/stats'),
  alerts: () => api.get('/dashboard/alerts'),
  savings: () => api.get('/dashboard/savings'),
  priceHistory: (id, days=30) => api.get(`/dashboard/price-history/${id}?days=${days}`),

  // Products
  products: (uid) => api.get(`/products/?user_id=${uid}&limit=50`),
  addProduct: (d) => api.post('/products/', d),
  removeProduct: (id) => api.delete(`/products/${id}`),
  checkNow: (id) => api.post(`/products/${id}/check`),
  updateProduct: (id, d) => api.patch(`/products/${id}`, d),
};

/* ═══════════════════════════════════════════════════════════
   CONTEXT
   ═══════════════════════════════════════════════════════════ */
const AppCtx = createContext(null);

function useApp() { return useContext(AppCtx); }

/* ═══════════════════════════════════════════════════════════
   UTILS
   ═══════════════════════════════════════════════════════════ */
const fmtPrice = (v) => v != null
  ? `R$ ${Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
  : '—';

const fmtDate = (d) => d ? new Date(d).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' }) : '—';

const statusBadge = (s) => {
  const map = {
    active: ['badge-active', 'Ativo'],
    paused: ['badge-paused', 'Pausado'],
    alerted: ['badge-alerted', '🔔 Alertado'],
    error: ['badge-error', 'Erro'],
  };
  const [cls, lbl] = map[s] || ['badge-paused', s];
  return <span className={`badge ${cls}`}>{lbl}</span>;
};

const storeEmoji = (s) => ({ amazon:'📦', mercadolivre:'🛒', shopee:'🛍️', magalu:'🏪' }[s] || '🔗');

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
function Toasts({ toasts }) {
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>
          <span>{t.type === 'success' ? '✅' : '❌'}</span>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   AUTH — LOGIN / REGISTER
   ═══════════════════════════════════════════════════════════ */
function AuthPage({ onAuth }) {
  const [mode, setMode] = useState('login');
  const [form, setForm] = useState({ name:'', email:'', password:'' });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  // FIX 2: troca de modo preserva email e senha já digitados
  const switchMode = (newMode) => {
    setMode(newMode);
    setError('');
    // mantém email e senha, só limpa nome se voltar para login
  };

  const submit = async (ev) => {
    ev.preventDefault();
    setError(''); setLoading(true);
    try {
      let data;
      if (mode === 'login') {
        data = await api.login(form.email, form.password);
      } else {
        data = await api.register({ name: form.name, email: form.email, password: form.password });
      }
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      onAuth(data.user);
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="auth-logo">
          <div className="dot" />
          PriceWatch
        </div>
        <div className="auth-title">{mode === 'login' ? 'Entrar' : 'Criar conta'}</div>
        <div className="auth-sub">
          {mode === 'login' ? 'Monitoramos preços por você e avisamos quando cair.' : 'Crie sua conta grátis e comece a economizar hoje.'}
        </div>
        <form onSubmit={submit}>
          {mode === 'register' && (
            <div className="form-group">
              <label className="form-label">Nome</label>
              <input className="form-input" placeholder="Seu nome" value={form.name} onChange={set('name')} required autoFocus />
            </div>
          )}
          <div className="form-group">
            <label className="form-label">Email</label>
            <input className="form-input" type="email" placeholder="email@exemplo.com" value={form.email} onChange={set('email')} required />
          </div>
          <div className="form-group">
            <label className="form-label">Senha</label>
            <input className="form-input" type="password" placeholder={mode === 'register' ? 'Mínimo 6 caracteres' : '••••••••'} value={form.password} onChange={set('password')} required />
          </div>
          {error && <div className="error-msg">⚠️ {error}</div>}
          <div style={{marginTop: 24}}>
            <button className="btn btn-primary" type="submit" disabled={loading}>
              {loading ? <><div className="spinner" /> Aguarde...</> : (mode === 'login' ? 'Entrar' : 'Criar conta')}
            </button>
          </div>
        </form>
        <div className="auth-link">
          {mode === 'login'
            ? <>Não tem conta? <a onClick={() => switchMode('register')}>Cadastre-se — é grátis</a></>
            : <>Já tem conta? <a onClick={() => switchMode('login')}>Entrar</a></>
          }
        </div>
      </div>
    </div>
  );
}


/* ═══════════════════════════════════════════════════════════
   BOTTOM NAVIGATION (mobile)

/* ═══════════════════════════════════════════════════════════
   MINI CHART (SVG sparkline)
   ═══════════════════════════════════════════════════════════ */
function Sparkline({ data, color='#00d97e', width=200, height=50 }) {
  if (!data || data.length < 2) return <div style={{height, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--text-faint)', fontSize:12}}>Sem dados</div>;
  const prices = data.map(d => d.price);
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = max - min || 1;
  const pts = data.map((d, i) => {
    const x = (i / (data.length-1)) * width;
    const y = height - ((d.price - min) / range) * (height * 0.8) - height * 0.1;
    return `${x},${y}`;
  }).join(' ');

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{width:'100%', height}} preserveAspectRatio="none">
      <defs>
        <linearGradient id={`sg${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polyline fill={`url(#sg${color.replace('#','')})`} stroke="none"
        points={`0,${height} ${pts} ${width},${height}`} />
      <polyline fill="none" stroke={color} strokeWidth="1.5"
        points={pts} strokeLinejoin="round" strokeLinecap="round"/>
    </svg>
  );
}

/* ═══════════════════════════════════════════════════════════

              ))}

          </div>

        {stats.total_saved > 0 && (
          <div className="savings-banner mb-24">
            <div style={{fontSize:32}}>🎉</div>
            <div>
              <div className="savings-amount">{fmtPrice(stats.total_saved)}</div>

                ? <div className="empty"><div className="empty-icon">🔕</div><div className="empty-sub">Nenhum alerta ainda</div></div>

                  <div key={a.id} className="alert-item">
                    <div className={`alert-icon ${a.alert_type === 'promotion' ? 'promo' : 'drop'}`}>{a.alert_type === 'promotion' ? '🔥' : '📉'}</div>

/* ═══════════════════════════════════════════════════════════
   MODAL — ADICIONAR PRODUTO
   ═══════════════════════════════════════════════════════════ */
function AddProductModal({ userId, onClose, onAdded, toast }) {
  const [form, setForm] = useState({ name:'', url:'', target_price:'', alert_percentage:'' });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

  const submit = async (ev) => {
    ev.preventDefault();
    if (!form.target_price && !form.alert_percentage) {
      setError('Informe o preço alvo ou percentual de queda');
      return;
    }
    setError(''); setLoading(true);
    try {
      const body = {
        user_id: userId,
        name: form.name,
        url: form.url,
        target_price: form.target_price ? parseFloat(form.target_price) : undefined,
        alert_percentage: form.alert_percentage ? parseFloat(form.alert_percentage) : undefined,
      };
      const prod = await api.addProduct(body);
      toast('Produto adicionado! Verificando preço...', 'success');
      onAdded(prod);
      onClose();
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">📦 Monitorar produto</div>
        <form onSubmit={submit}>
          <div className="form-group">
            <label className="form-label">Nome do Produto</label>
            <input className="form-input" placeholder="Ex: Notebook Gamer XYZ" value={form.name} onChange={set('name')} required />
          </div>
          <div className="form-group">
            <label className="form-label">Link do produto</label>
            <input className="form-input" type="url" placeholder="https://www.amazon.com.br/dp/..." value={form.url} onChange={set('url')} required />
          </div>
          <div className="two-col" style={{marginBottom:0}}>
            <div className="form-group">
              <label className="form-label">Me avisa quando chegar em (R$)</label>
              <input className="form-input" type="number" step="0.01" min="0.01" placeholder="299,90" value={form.target_price} onChange={set('target_price')} />
            </div>
            <div className="form-group">
              <label className="form-label">Ou se cair mais de (%)</label>
              <input className="form-input" type="number" min="1" max="100" placeholder="Ex: 10" value={form.alert_percentage} onChange={set('alert_percentage')} />
            </div>
          </div>
          <div style={{fontSize:12, color:'var(--text-dim)', marginTop:-8, marginBottom:16, lineHeight:1.5}}>
            💡 <strong>Preço alvo:</strong> avisa quando chegar nesse valor.<br/>
            &nbsp;&nbsp;&nbsp;&nbsp;<strong>Alertar se cair %:</strong> avisa quando cair X% do preço atual.<br/>
            &nbsp;&nbsp;&nbsp;&nbsp;Pode usar os dois juntos!
          </div>
          {error && <div className="error-msg">⚠️ {error}</div>}
          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onClose}>Cancelar</button>
            <button type="submit" className="btn btn-primary" style={{flex:1}} disabled={loading}>
              {loading ? <><div className="spinner"/>Adicionando...</> : '+ Adicionar'}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MODAL — DETALHES DO PRODUTO (com histórico)
   ═══════════════════════════════════════════════════════════ */
function ProductDetailModal({ product, onClose, onRemove, toast }) {
  const [history, setHistory] = useState([]);
  const [checking, setChecking] = useState(false);

  // FIX 6: fechar com ESC
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  useEffect(() => {
    api.priceHistory(product.id, 30).then(setHistory).catch(() => {});
  }, [product.id]);

  const checkNow = async () => {
    setChecking(true);
    try {
      await api.checkNow(product.id);
      const h = await api.priceHistory(product.id, 30);
      setHistory(h);
      toast('Preço verificado!', 'success');
    } catch(e) { toast(e.message, 'error'); }
    finally { setChecking(false); }
  };

  const status = typeof product.status === 'string' ? product.status : String(product.status).split('.').pop().toLowerCase();

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{width:520}}>
        <div style={{display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20}}>
          <div>
            <div style={{fontSize:20, marginBottom:4}}>{storeEmoji(product.store)}</div>
            <div className="modal-title" style={{marginBottom:4}}>{product.name}</div>
            <div style={{display:'flex', gap:8, alignItems:'center'}}>
              {statusBadge(status)}
              {product.store && <span style={{fontSize:11, color:'var(--text-dim)', textTransform:'uppercase'}}>{product.store}</span>}
            </div>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={onClose} style={{display:'flex', alignItems:'center', gap:6, flexShrink:0}}>
            ← Voltar
          </button>
        </div>

        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, marginBottom:20}}>
          {[
            ['Atual', product.current_price, 'var(--green)'],
            ['Alvo', product.target_price, 'var(--accent)'],
            ['Mínimo', product.lowest_price, 'var(--yellow)'],
          ].map(([lbl, val, color]) => (
            <div key={lbl} style={{background:'var(--bg3)', borderRadius:'var(--radius)', padding:'12px 14px'}}>
              <div style={{fontSize:11, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:6}}>{lbl}</div>
              <div style={{fontFamily:'var(--font-mono)', fontSize:16, color, fontWeight:500}}>{fmtPrice(val)}</div>
            </div>
          ))}
        </div>

        <div className="card-title" style={{marginBottom:10}}>📈 Histórico 30 dias</div>
        <div style={{marginBottom:20}}>
          <Sparkline data={history} height={80} />
        </div>

        {product.url_affiliate && (
          <a href={product.url_affiliate} target="_blank" rel="noopener noreferrer"
            className="btn btn-ghost" style={{width:'100%', marginBottom:12, textDecoration:'none'}}>
            🔗 Ver produto (link afiliado)
          </a>
        )}

        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={checkNow} disabled={checking} style={{flex:1}}>
            {checking ? <><div className="spinner"/>...</> : '🔄 Verificar Agora'}
          </button>
          <button className="btn btn-danger btn-sm" onClick={() => { onRemove(product.id); onClose(); }}>
            🗑️ Remover
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PAGE: PRODUCTS
   ═══════════════════════════════════════════════════════════ */
function ProductsPage() {
  const { user, toast } = useApp();
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showAdd, setShowAdd] = useState(false);
  const [selected, setSelected] = useState(null);
  const [search, setSearch] = useState('');

  const load = useCallback(() => {
    if (!user) return;
    api.products(user.id).then(setProducts).catch(console.error).finally(() => setLoading(false));
  }, [user]);

  useEffect(() => { load(); }, [load]);

  const remove = async (id) => {
    try {
      await api.removeProduct(id);
      setProducts(ps => ps.filter(p => p.id !== id));
      toast('Produto removido', 'success');
    } catch(e) { toast(e.message, 'error'); }
  };

  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(search.toLowerCase()) ||
    (p.store||'').toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      <div className="page-header">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
          <div>
            <div className="page-title">Meus Produtos</div>
            <div className="page-sub">{products.length} produto{products.length !== 1 ? 's' : ''} monitorado{products.length !== 1 ? 's' : ''}</div>
          </div>
          <button className="btn btn-primary btn-add-desktop" style={{width:'auto'}} onClick={() => setShowAdd(true)}>
            + Adicionar
          </button>
        </div>
      </div>
      <div className="page-body">
        <div style={{marginBottom:16}}>
          <input className="form-input" placeholder="🔍 Buscar por nome ou loja..." value={search} onChange={e => setSearch(e.target.value)} />
        </div>

        {loading
          ? <div className="loading"><div className="spinner"/>Carregando...</div>
          : filtered.length === 0
          ? <div className="empty">
              <div className="empty-icon">📦</div>
              <div className="empty-title">{search ? 'Nenhum resultado' : 'Nenhum produto ainda'}</div>
              <div className="empty-sub">{search ? 'Tente outro termo' : 'Clique em "+ Adicionar" para começar'}</div>
            </div>
          : <div>
              {filtered.filter(p => {
                const s = (typeof p.status==='string'?p.status:String(p.status).split('.').pop()).toLowerCase();
                return s==='alerted' || s==='error';
              }).map(p => {
                const s = (typeof p.status==='string'?p.status:String(p.status).split('.').pop()).toLowerCase();
                const isA = s==='alerted';
                return (
                  <div key={'sc'+p.id} style={{background:isA?'rgba(255,209,102,0.06)':'rgba(255,77,106,0.06)',border:'1px solid '+(isA?'rgba(255,209,102,0.3)':'rgba(255,77,106,0.3)'),borderRadius:'var(--radius-lg)',padding:'14px 18px',marginBottom:10}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                      <div style={{fontSize:13,fontWeight:600,color:'var(--text)',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{storeEmoji(p.store)} {p.name}</div>
                      <div style={{flexShrink:0,marginLeft:8}}>{statusBadge(s)}</div>
                    </div>
                    <div style={{fontSize:12,color:'var(--text-dim)',marginBottom:10,lineHeight:1.5}}>{isA?'Preço alvo atingido! Aproveite enquanto está barato.':'Não conseguimos acessar. O produto pode ter saído de estoque ou o link mudou.'}</div>
                    <div style={{display:'flex',gap:8}}>
                      {isA && p.url_affiliate && <a href={p.url_affiliate} target="_blank" rel="noopener noreferrer" style={{flex:1,background:'var(--yellow)',color:'#0a0a0f',borderRadius:'var(--radius)',padding:'7px 12px',textAlign:'center',fontSize:12,fontWeight:600,textDecoration:'none'}}>Ver produto →</a>}
                      <button onClick={async e=>{e.stopPropagation();try{await api.checkNow(p.id);load();toast('Verificando...','success');}catch(er){toast(er.message,'error');}}} style={{flex:isA?0:1,background:'var(--bg3)',color:'var(--text-dim)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'7px 14px',fontSize:12,cursor:'pointer'}}>{isA?'Reativar':'Tentar novamente'}</button>
                    </div>
                  </div>
                );
              })}
              <div className="card">
                <div className="product-list">
                {filtered.map((p, i) => {
                  const status = typeof p.status === 'string' ? p.status : String(p.status).split('.').pop().toLowerCase();
                  const discPct = p.initial_price && p.current_price
                    ? ((1 - p.current_price/p.initial_price)*100).toFixed(1)
                    : null;
                  return (
                    <div key={p.id} className="product-row" style={{borderBottom: i<filtered.length-1 ? '1px solid var(--border)' : 'none'}}
                      onClick={() => setSelected(p)}>
                      <div style={{minWidth:0}}>
                        <div className="product-name">{storeEmoji(p.store)} {p.name}</div>
                        <div className="product-store">{p.store || 'desconhecida'} · ID {p.id}</div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div className="price-current">{fmtPrice(p.current_price)}</div>
                        {p.target_price && <div className="price-target">alvo {fmtPrice(p.target_price)}</div>}
                      </div>
                      {discPct && Number(discPct) > 0 && (
                        <div className="discount-tag">-{discPct}%</div>
                      )}
                      {statusBadge(status)}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        }
      </div>

      {showAdd && <AddProductModal userId={user.id} onClose={() => setShowAdd(false)} onAdded={() => load()} toast={toast} />}
      {selected && <ProductDetailModal product={selected} onClose={() => setSelected(null)} onRemove={remove} toast={toast} />}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PAGE: UPGRADE — Planos e Pagamento
   ═══════════════════════════════════════════════════════════ */
function UpgradePage() {
  const { user, toast } = useApp();
  const [plans, setPlans] = useState(null);
  const [billing, setBilling] = useState(null);
  const [loading, setLoading] = useState(true);
  const [checkoutLoading, setCheckoutLoading] = useState(false);
  const [cancelling, setCancelling] = useState(false);

  useEffect(() => {
    Promise.all([api.plans(), api.billingStatus()])
      .then(([p, b]) => { setPlans(p); setBilling(b); })
      .catch(console.error)
      .finally(() => setLoading(false));
  }, []);

  const startCheckout = async (planId) => {
    setCheckoutLoading(true);
    try {
      const data = await api.createCheckout(planId);
      // Redireciona para o checkout (MP, Stripe ou Mock)
      window.location.href = data.checkout_url;
    } catch(e) {
      toast(e.message, 'error');
      setCheckoutLoading(false);
    }
  };

  const cancelPlan = async () => {
    if (!confirm('Tem certeza que deseja cancelar o Premium? Você voltará para o plano Gratuito.')) return;
    setCancelling(true);
    try {
      await api.cancelSubscription();
      toast('Assinatura cancelada. Você está no plano Gratuito.', 'success');
      // Recarrega status
      const b = await api.billingStatus();
      setBilling(b);
    } catch(e) { toast(e.message, 'error'); }
    finally { setCancelling(false); }
  };

  if (loading) return <div className="loading"><div className="spinner"/>Carregando planos...</div>;

  const isPremium = billing?.is_premium;
  const daysLeft = billing?.days_remaining;
  const gateway = plans?.active_gateway || 'mock';

  const gatewayLabels = {
    mercadopago: '💳 Pix, Cartão, Boleto',
    stripe: '💳 Cartão Internacional',
    mock: '🧪 Ambiente de Teste',
  };

  return (
    <div>
      <div className="page-header">
        <div className="page-title">⚡ Planos</div>
        <div className="page-sub">{billing?`Usando ${billing.current_product_count||0} de ${billing.max_products===9999?'∞':billing.max_products} produtos`:'Escolha o plano ideal para você'}</div>
      </div>
      <div className="page-body">

        {billing && !billing.is_premium && billing.max_products !== 9999 && (
          <div style={{marginBottom:20}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text-dim)',marginBottom:6}}>
              <span>Limite do plano gratuito</span>
              <span style={{fontWeight:600,color:(billing.current_product_count||0)>=(billing.max_products||5)?'var(--red)':'var(--text)'}}>{billing.current_product_count||0} / {billing.max_products||5}</span>
            </div>
            <div style={{height:6,background:'var(--bg3)',borderRadius:3,overflow:'hidden'}}>
              <div style={{height:'100%',width:Math.min(((billing.current_product_count||0)/(billing.max_products||5))*100,100)+'%',background:(billing.current_product_count||0)>=(billing.max_products||5)?'var(--red)':'var(--accent)',borderRadius:3,transition:'width 0.5s ease'}}></div>
            </div>
            {(billing.current_product_count||0)>=(billing.max_products||5) && <div style={{fontSize:12,color:'var(--red)',marginTop:6}}>⚠️ Limite atingido. Faça upgrade para adicionar mais produtos.</div>}
          </div>
        )}

        {/* Status atual */}
        {isPremium && (
          <div style={{
            background:'linear-gradient(135deg, rgba(255,209,102,0.12) 0%, rgba(108,92,231,0.1) 100%)',
            border:'1px solid rgba(255,209,102,0.3)',
            borderRadius:'var(--radius-lg)',
            padding:'20px 24px',
            marginBottom:24,
            display:'flex',
            alignItems:'center',
            gap:16,
          }}>
            <div style={{fontSize:32}}>👑</div>

              <div style={{fontFamily:'var(--font-head)', fontWeight:700, fontSize:16, color:'var(--yellow)'}}>Você é Premium!</div>

                {daysLeft != null ? `${daysLeft} dias restantes` : 'Assinatura ativa'}
                {billing?.expires_at ? ` · Renova em ${new Date(billing.expires_at).toLocaleDateString('pt-BR')}` : ''}
              </div>
            </div>
            <button className="btn btn-danger btn-sm" onClick={cancelPlan} disabled={cancelling}>
              {cancelling ? <><div className="spinner"/>...</> : 'Cancelar'}
            </button>
          </div>
        )}

        {/* Cards de plano */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:24}}>
          {plans?.plans?.map(plan => {
            const isCurrent = billing?.current_plan === plan.id;
            const isPremiumPlan = plan.id === 'premium';

              <div key={plan.id} style={{

                padding:28,
                position:'relative',
                overflow:'hidden',
              }}>
                {isPremiumPlan && (
                  <div style={{
                    position:'absolute', top:16, right:16,
                    background:'var(--yellow-dim)', color:'var(--yellow)',
                    padding:'4px 10px', borderRadius:6,
                    fontSize:11, fontWeight:700, textTransform:'uppercase',
                  }}>Recomendado</div>
                )}
                <div style={{fontFamily:'var(--font-head)', fontSize:22, fontWeight:800, marginBottom:6}}>
                  {plan.name}

                <div style={{fontFamily:'var(--font-mono)', fontSize:32, color: isPremiumPlan ? 'var(--green)' : 'var(--text)', fontWeight:600, marginBottom:4}}>
                  {plan.price.brl}
                  {plan.price.brl_raw > 0 && <span style={{fontSize:14, color:'var(--text-dim)', fontWeight:400}}>/mês</span>}
                </div>
                <div style={{color:'var(--text-dim)', fontSize:13, marginBottom:20}}>{plan.description}</div>

                <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:24}}>
                  {[
                    ['📦', 'Produtos', plan.features.max_products],
                    ['⏱️', 'Verificação', plan.features.check_interval],
                    ['📅', 'Histórico', plan.features.history],
                    ['🔔', 'Alertas Telegram', plan.features.telegram],
                    ['📢', 'Canal promoções', plan.features.promotions],
                    ['🚀', 'Scraping prioritário', plan.features.priority],
                    ['📊', 'Exportar CSV', plan.features.export],
                  ].map(([icon, label, val]) => (
                    <div key={label} style={{display:'flex', alignItems:'center', gap:8, fontSize:13}}>
                      <span>{icon}</span>
                      <span style={{color:'var(--text-dim)', flex:1}}>{label}</span>
                      <span style={{
                        color: val === true ? 'var(--green)' : val === false ? 'var(--text-faint)' : 'var(--text)',
                        fontFamily: typeof val === 'string' ? 'var(--font-mono)' : 'inherit',
                        fontSize: typeof val === 'string' ? 12 : 14,
                      }}>
                        {val === true ? '✓' : val === false ? '✗' : val}
                      </span>
                    </div>
                  ))}
                </div>

                {isCurrent ? (
                  <div style={{
                    textAlign:'center', padding:'10px',
                    background:'var(--bg3)', borderRadius:'var(--radius)',
                    fontSize:13, color:'var(--text-dim)',
                  }}>✓ Plano atual</div>
                ) : isPremiumPlan ? (
                  <button
                    className="btn btn-primary"
                    onClick={() => startCheckout(plan.id)}
                    disabled={checkoutLoading}
                    style={{fontSize:15}}
                  >
                    {checkoutLoading
                      ? <><div className="spinner"/>Redirecionando...</>
                      : '⚡ Assinar por R$ 19/mês'
                    }
                  </button>
                ) : (
                  <div style={{textAlign:'center', fontSize:13, color:'var(--text-dim)', padding:10}}>Gratuito para sempre</div>
                )}
              </div>
            );
          })}
        </div>

        {/* Gateway info */}
        <div style={{
          background:'var(--bg2)', border:'1px solid var(--border)',
          borderRadius:'var(--radius)', padding:'14px 18px',
          display:'flex', alignItems:'center', gap:12,
          fontSize:13, color:'var(--text-dim)',
        }}>
          <span style={{fontSize:18}}>🔒</span>
          <div>
            <strong style={{color:'var(--text)'}}>Pagamento seguro</strong>
            {' · '}{gatewayLabels[gateway]}
            {gateway === 'mock' && (
              <span style={{color:'var(--yellow)', marginLeft:8}}>
                — configure MERCADOPAGO ou STRIPE no .env para produção
              </span>
            )}
          </div>
        </div>

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   APP ROOT
   ═══════════════════════════════════════════════════════════ */
function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [toasts, setToasts] = useState([]);
  const [booting, setBooting] = useState(true);

  const toast = useCallback((msg, type='success') => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000);
  }, []);

  // Detecta retorno do checkout
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('upgrade') === 'success') {
      setPage('upgrade');
      // Limpa URL sem recarregar
      window.history.replaceState({}, '', '/app');
    }
  }, []);

  // Tenta restaurar sessão do localStorage
  useEffect(() => {
    const token = localStorage.getItem('access_token');
    if (token) {
      api.me().then(u => { setUser(u); }).catch(() => {
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
      }).finally(() => setBooting(false));
    } else {
      setBooting(false);
    }
  }, []);

  const logout = () => {
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    setUser(null);
    setPage('dashboard');
  };

  if (booting) return (
    <div style={{minHeight:'100vh', display:'grid', placeItems:'center', background:'var(--bg)'}}>
      <div style={{textAlign:'center', color:'var(--text-dim)'}}>
        <div style={{fontFamily:'var(--font-head)', fontSize:24, color:'var(--accent)', marginBottom:16}}>PriceWatch</div>
        <div className="spinner" style={{margin:'0 auto'}}/>
      </div>
    </div>
  );

  if (!user) return (
    <AppCtx.Provider value={{ user, toast }}>
      <AuthPage onAuth={u => setUser(u)} />
      <Toasts toasts={toasts} />
    </AppCtx.Provider>
  );

  const pages = {
    dashboard: <DashboardPage />,
    products:  <ProductsPage />,
    alerts:    <AlertsPage />,
    savings:   <SavingsPage />,
    upgrade:   <UpgradePage />,
  };

  return (
    <AppCtx.Provider value={{ user, toast }}>
      <div className="app-layout">
        <Sidebar page={page} setPage={setPage} user={user} onLogout={logout} />
        <main className="main">{pages[page]}</main>
      </div>
      <BottomNav page={page} setPage={setPage} />
      {page === 'products' && (
        <button
          className="fab"
          onClick={() => {
            // dispara clique no botão escondido de adicionar
            const btn = document.querySelector('.btn-add-desktop');
            if (btn) btn.click();
            else setPage('products');
          }}
          title="Adicionar produto"
        >+</button>
      )}
      <Toasts toasts={toasts} />
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
