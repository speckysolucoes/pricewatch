# ════════════════════════════════════════════════════════════
# nginx.conf — Proxy Reverso para o Price Monitor Bot
#
# FUNCIONALIDADES:
#   - Proxy para FastAPI (API + frontend)
#   - Rate limiting (proteção contra abuse)
#   - Headers de segurança
#   - Compressão gzip
#   - SSL/HTTPS (comentado — ativar com Let's Encrypt)
# ════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Compressão ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── Rate Limiting ─────────────────────────────────────
    # Limita por IP: 30 req/min para API geral
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    # Mais restrito para auth: 10 req/min (evita brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    # Webhooks: sem limite (vêm de IPs conhecidos do gateway)
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=120r/m;

    # ── Upstream: FastAPI ─────────────────────────────────
    upstream api {
        server api:8000;
        keepalive 32;
    }

    # ── Servidor HTTP (redireciona para HTTPS em produção) ─
    server {
        listen 80;
        server_name _;

        # Health check do load balancer (sem rate limit)
        location /health {
            proxy_pass http://api/;
            access_log off;
        }

        # Em desenvolvimento: serve direto
        # Em produção: descomentar redirect abaixo e comentar o proxy
        # return 301 https://$host$request_uri;

        # ── Segurança ──────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Rotas de Auth (rate limit restrito) ───────────
        location /auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Webhooks (sem rate limit, mais timeout) ────────
        location /billing/webhook/ {
            limit_req zone=webhook_limit burst=20 nodelay;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;

            # Repassa body bruto para validação de assinatura
            proxy_request_buffering off;
        }

        # ── Flower (protegido por auth básica) ─────────────
        location /flower/ {
            proxy_pass http://flower:5555/flower/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── API e Frontend (rate limit geral) ─────────────
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeout para scraping (pode demorar)
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }

    # ── HTTPS (ativar em produção com Let's Encrypt) ───────
    # server {
    #     listen 443 ssl http2;
    #     server_name seudominio.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
